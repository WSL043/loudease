name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Static and DSP checks
        run: npm test
      - name: Experimental true-peak audit (known limitation)
        id: true_peak
        continue-on-error: true
        run: npm run audit:true-peak
      - name: Surface unresolved true-peak results
        if: steps.true_peak.outcome == 'failure'
        run: Write-Output '::warning title=Unresolved true-peak audit::The strict inter-sample audit failed. This non-blocking research step does not establish true-peak safety. Review its output and docs/DSP_EVALUATION.md.'
      - name: Popup persistence integration
        run: npm run test:slider
      - name: Offline candidate peak regressions (not shipped)
        run: |
          node tools/true_peak_candidate.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/true_peak_candidate_evaluation.js --stress-only
      - name: Supported capture integration
        run: npm run test:capture
      - name: Chrome volume intent and candidate research (not shipped)
        run: npm run audit:browser-candidate
      - name: Store release build
        run: npm run test:release
