name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static and DSP checks
        run: npm test
      - name: Popup persistence integration
        run: npm run test:slider
      - name: Store release build
        run: npm run test:release
