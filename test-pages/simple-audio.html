<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simple Audio Test</title>
</head>
<body>
  <h1>Simple Audio Test</h1>
  <button id="start">Start tone</button>
  <button id="stop">Stop</button>
  <audio id="tone" loop></audio>
  <script>
    let toneUrl;
    const audio = document.getElementById('tone');
    const params = new URLSearchParams(location.search);
    const configuredGain = Number(params.get('gain'));
    const toneGain = Number.isFinite(configuredGain) && configuredGain > 0 ? Math.min(1, configuredGain) : 0.08;

    function writeString(view, offset, value) {
      for (let i = 0; i < value.length; i += 1) {
        view.setUint8(offset + i, value.charCodeAt(i));
      }
    }

    function makeToneUrl({ frequency = 440, gain = 0.08, duration = 2, sampleRate = 48000 } = {}) {
      const samples = Math.floor(duration * sampleRate);
      const buffer = new ArrayBuffer(44 + samples * 2);
      const view = new DataView(buffer);
      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, samples * 2, true);
      for (let i = 0; i < samples; i += 1) {
        const sample = Math.sin((i / sampleRate) * frequency * Math.PI * 2) * gain;
        view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, sample)) * 32767, true);
      }
      return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
    }

    document.getElementById('start').addEventListener('click', async () => {
      toneUrl = toneUrl || makeToneUrl({ gain: toneGain });
      audio.src = toneUrl;
      audio.volume = 1;
      await audio.play();
      window.__WVB_TEST_AUDIO_STATE__ = { started: true, paused: audio.paused, currentTime: audio.currentTime, gain: toneGain };
    });
    document.getElementById('stop').addEventListener('click', () => {
      audio.pause();
      audio.currentTime = 0;
      window.__WVB_TEST_AUDIO_STATE__ = { started: false, paused: audio.paused, currentTime: audio.currentTime };
    });
  </script>
</body>
</html>
