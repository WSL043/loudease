<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Offline Audio Graph Test</title>
</head>
<body>
  <h1>Offline Audio Graph Test</h1>
  <button id="run">Run offline graph</button>
  <pre id="result">idle</pre>
  <script src="/shared/core.js"></script>
  <script src="/shared/programme-leveler-policy.js"></script>
  <script>
    const result = document.getElementById('result');

    const SAMPLE_RATE = 48000;
    const FRAME_MS = 20;
    const FRAME_SIZE = Math.round(SAMPLE_RATE * FRAME_MS / 1000);
    const PROGRAMME_PARAMS = window.LoudEaseProgrammePolicy.DEFAULT_PARAMS;
    const TARGET_RMS_DB = PROGRAMME_PARAMS.programmeTargetDb;
    const NOISE_FLOOR_DB = -62;
    const SIGNAL_PEAK_FLOOR = 0.00035;
    const MAX_LIFT_DB = PROGRAMME_PARAMS.maxLiftDb;
    const MAX_CUT_DB = PROGRAMME_PARAMS.maxCutDb;
    const LIMITER_CEILING_DB = -3;
    const CUT_ATTACK_SECONDS = 0.02;
    const CUT_RELEASE_SECONDS = 0.25;
    const LIFT_ATTACK_SECONDS = 0.18;
    const LIFT_RELEASE_SECONDS = 0.12;
    const MAX_GAIN_INCREASE_STEP_DB = 3;
    const MOMENTARY_HISTORY_FRAMES = 20;
    const MAX_HISTORY_FRAMES = 150;

    const settings = {
      enabled: true,
      respectPlayerVolume: true,
      cutStrength: 100,
      liftStrength: 100
    };

    function sine(frequency, amplitude, phase = 0) {
      return (time) => amplitude * Math.sin((2 * Math.PI * frequency * time) + phase);
    }

    function appendSamples(target, seconds, generator) {
      const start = target.length;
      const count = Math.round(seconds * SAMPLE_RATE);
      for (let i = 0; i < count; i += 1) {
        target.push(generator((start + i) / SAMPLE_RATE, i));
      }
      return { start, end: target.length };
    }

    function buildFixture() {
      const samples = [];
      const segments = {};
      segments.silence = appendSamples(samples, 0.6, () => 0);
      segments.quietVoice = appendSamples(samples, 6.0, (time) => (
        sine(180, 0.004)(time)
        + sine(360, 0.0024, 0.2)(time)
        + sine(2400, 0.0009, 0.5)(time)
      ));
      segments.loudTone = appendSamples(samples, 5.0, sine(1000, 0.18));
      segments.burst = appendSamples(samples, 0.36, sine(1000, 0.65));
      segments.recovery = appendSamples(samples, 6.0, (time) => (
        sine(220, 0.009)(time)
        + sine(440, 0.0025, 0.3)(time)
      ));
      return { samples: Float32Array.from(samples), segments };
    }

    function frameStats(samples, start, end) {
      let sum = 0;
      let peak = 0;
      for (let i = start; i < end; i += 1) {
        const sample = samples[i] || 0;
        sum += sample * sample;
        peak = Math.max(peak, Math.abs(sample));
      }
      return { energy: sum / Math.max(1, end - start), peak };
    }

    function highpassCoefficients(frequencyHz, q) {
      const omega = (2 * Math.PI * frequencyHz) / SAMPLE_RATE;
      const cosine = Math.cos(omega);
      const alpha = Math.sin(omega) / (2 * q);
      const a0 = 1 + alpha;
      return {
        b0: ((1 + cosine) / 2) / a0,
        b1: (-(1 + cosine)) / a0,
        b2: ((1 + cosine) / 2) / a0,
        a1: (-2 * cosine) / a0,
        a2: (1 - alpha) / a0
      };
    }

    function highShelfCoefficients(frequencyHz, gainDb) {
      const amplitude = 10 ** (gainDb / 40);
      const omega = (2 * Math.PI * frequencyHz) / SAMPLE_RATE;
      const cosine = Math.cos(omega);
      const alpha = (Math.sin(omega) / 2) * Math.sqrt(2);
      const rootTerm = 2 * Math.sqrt(amplitude) * alpha;
      const a0 = (amplitude + 1) - ((amplitude - 1) * cosine) + rootTerm;
      return {
        b0: (amplitude * ((amplitude + 1) + ((amplitude - 1) * cosine) + rootTerm)) / a0,
        b1: (-2 * amplitude * ((amplitude - 1) + ((amplitude + 1) * cosine))) / a0,
        b2: (amplitude * ((amplitude + 1) + ((amplitude - 1) * cosine) - rootTerm)) / a0,
        a1: (2 * ((amplitude - 1) - ((amplitude + 1) * cosine))) / a0,
        a2: ((amplitude + 1) - ((amplitude - 1) * cosine) - rootTerm) / a0
      };
    }

    function applyBiquad(samples, coefficients) {
      const output = new Float32Array(samples.length);
      let x1 = 0;
      let x2 = 0;
      let y1 = 0;
      let y2 = 0;
      for (let i = 0; i < samples.length; i += 1) {
        const x0 = samples[i];
        const y0 = (coefficients.b0 * x0)
          + (coefficients.b1 * x1)
          + (coefficients.b2 * x2)
          - (coefficients.a1 * y1)
          - (coefficients.a2 * y2);
        output[i] = y0;
        x2 = x1;
        x1 = x0;
        y2 = y1;
        y1 = y0;
      }
      return output;
    }

    function applyKWeighting(samples, params) {
      const shelf = applyBiquad(samples, highShelfCoefficients(params.shelfFrequencyHz, params.shelfGainDb));
      return applyBiquad(shelf, highpassCoefficients(params.highpassFrequencyHz, params.highpassQ));
    }

    function smoothGain(currentGainDb, targetGainDb, seconds, frameStartGainDb = currentGainDb) {
      const timeConstant = Math.max(0.001, seconds);
      const alpha = 1 - Math.exp(-(FRAME_MS / 1000) / timeConstant);
      const nextGainDb = currentGainDb + ((targetGainDb - currentGainDb) * alpha);
      return Math.min(nextGainDb, frameStartGainDb + MAX_GAIN_INCREASE_STEP_DB);
    }

    function pushBounded(target, value, maxLength) {
      target.push(value);
      if (target.length > maxLength) {
        target.splice(0, target.length - maxLength);
      }
    }

    function gainSchedule(samples, segments) {
      const {
        ProgrammeLoudnessEstimator,
        computeTargetGainDb
      } = window.LoudEaseProgrammePolicy;
      const {
        energyToDb,
        K_WEIGHTING_PARAMS,
        linearToDb,
        meanLast
      } = window.WebVolumeBalancerCore;
      const weightedSamples = applyKWeighting(samples, K_WEIGHTING_PARAMS);
      const estimator = new ProgrammeLoudnessEstimator();
      let programmeState = estimator.snapshot();
      const schedule = [];
      const energyHistory = [];
      let programmeStride = 0;
      let silenceFrames = 0;
      let currentGainDb = 0;
      let targetGainDb = 0;
      const boundaryStarts = new Set([segments.quietVoice.start, segments.loudTone.start, segments.recovery.start]);
      for (let start = 0; start < samples.length; start += FRAME_SIZE) {
        const programmeBoundary = boundaryStarts.has(start);
        if (programmeBoundary) {
          estimator.reset();
          programmeState = estimator.snapshot();
          energyHistory.length = 0;
          programmeStride = 0;
          targetGainDb = 0;
          currentGainDb = 0;
        }
        const end = Math.min(samples.length, start + FRAME_SIZE);
        const { peak } = frameStats(samples, start, end);
        const { energy } = frameStats(weightedSamples, start, end);
        pushBounded(energyHistory, energy, MAX_HISTORY_FRAMES);
        const inputDb = energyToDb(energy);
        const momentaryEnergy = meanLast(energyHistory, MOMENTARY_HISTORY_FRAMES);
        const momentaryDb = energyToDb(momentaryEnergy);
        const fastDb = Math.max(inputDb, energyToDb(meanLast(energyHistory, 5)));
        const hasSignal = inputDb > NOISE_FLOOR_DB && peak > SIGNAL_PEAK_FLOOR;
        if (hasSignal) {
          silenceFrames = 0;
          programmeStride += 1;
          if (energyHistory.length >= MOMENTARY_HISTORY_FRAMES && programmeStride >= 5) {
            programmeState = estimator.addBlock(momentaryEnergy);
            programmeStride = 0;
          }
          targetGainDb = computeTargetGainDb({
            enabled: true,
            signalActive: true,
            cutStrength: settings.cutStrength,
            liftStrength: settings.liftStrength,
            programmeDb: programmeState.programmeDb,
            confidence: programmeState.confidence,
            momentaryDb,
            fastDb,
            peakDb: linearToDb(peak),
            limiterCeilingDb: LIMITER_CEILING_DB,
            canLift: true
          }).targetGainDb;
        } else {
          silenceFrames += 1;
          if (silenceFrames > 50) targetGainDb = 0;
        }
        const frameStartGainDb = currentGainDb;
        if (targetGainDb < currentGainDb && targetGainDb < 0) {
          currentGainDb = smoothGain(currentGainDb, targetGainDb, CUT_ATTACK_SECONDS, frameStartGainDb);
        } else if (targetGainDb > currentGainDb && currentGainDb < 0) {
          currentGainDb = smoothGain(currentGainDb, targetGainDb, CUT_RELEASE_SECONDS, frameStartGainDb);
        } else if (targetGainDb > currentGainDb) {
          currentGainDb = smoothGain(currentGainDb, targetGainDb, LIFT_ATTACK_SECONDS, frameStartGainDb);
        } else {
          currentGainDb = smoothGain(currentGainDb, targetGainDb, LIFT_RELEASE_SECONDS, frameStartGainDb);
        }
        schedule.push({
          start,
          end,
          time: start / SAMPLE_RATE,
          gainDb: currentGainDb,
          targetGainDb,
          inputDb,
          liftControlDb: momentaryDb,
          peakDb: linearToDb(peak),
          hasSignal,
          programmeBoundary
        });
      }
      return schedule;
    }

    function segmentMetrics(input, output, segment) {
      const {
        energyToDb,
        linearToDb
      } = window.WebVolumeBalancerCore;
      const inputStats = frameStats(input, segment.start, segment.end);
      const outputStats = frameStats(output, segment.start, segment.end);
      const inputDb = energyToDb(inputStats.energy);
      const outputDb = energyToDb(outputStats.energy);
      return {
        inputDb,
        outputDb,
        deltaDb: outputDb - inputDb,
        inputPeakDb: linearToDb(inputStats.peak),
        outputPeakDb: linearToDb(outputStats.peak)
      };
    }

    function gainStepSummary(schedule) {
      let maxIncrease = 0;
      let maxDecrease = 0;
      for (let i = 1; i < schedule.length; i += 1) {
        if (schedule[i].programmeBoundary) continue;
        const diff = schedule[i].gainDb - schedule[i - 1].gainDb;
        maxIncrease = Math.max(maxIncrease, diff);
        maxDecrease = Math.max(maxDecrease, -diff);
      }
      return { maxIncrease, maxDecrease };
    }

    function segmentFrameSummary(schedule, segment, maxElapsedSeconds) {
      const frames = schedule.filter((frame) => (
        frame.start >= segment.start
        && frame.start < segment.end
        && (frame.start - segment.start) < maxElapsedSeconds * SAMPLE_RATE
      ));
      let maxGainDb = -Infinity;
      let firstPositiveAtMs = null;
      for (const frame of frames) {
        maxGainDb = Math.max(maxGainDb, frame.gainDb);
        if (firstPositiveAtMs == null && frame.gainDb > 0.5) {
          firstPositiveAtMs = ((frame.start - segment.start) / SAMPLE_RATE) * 1000;
        }
      }
      return {
        maxGainDb: Number.isFinite(maxGainDb) ? maxGainDb : 0,
        firstPositiveAtMs
      };
    }

    function maxAbs(samples) {
      let peak = 0;
      for (const sample of samples) {
        peak = Math.max(peak, Math.abs(sample));
      }
      return peak;
    }

    async function createLimiter(context) {
      if (context.audioWorklet && window.AudioWorkletNode) {
        try {
          await context.audioWorklet.addModule('/offscreen/limiter-worklet.js');
          const limiter = new AudioWorkletNode(context, 'wvb-limiter-processor', {
            numberOfInputs: 1,
            numberOfOutputs: 1,
            outputChannelCount: [1]
          });
          limiter.port.postMessage({
            type: 'configure',
            enabled: true,
            ceilingDb: LIMITER_CEILING_DB,
            releaseSeconds: 0.08,
            lookaheadMs: 5
          });
          return { limiter, type: 'AudioWorkletNode', fallbackError: '' };
        } catch (error) {
          const fallback = context.createDynamicsCompressor();
          configureCompressorLimiter(fallback);
          return { limiter: fallback, type: 'DynamicsCompressorNode', fallbackError: String(error && error.message || error) };
        }
      }
      const fallback = context.createDynamicsCompressor();
      configureCompressorLimiter(fallback);
      return { limiter: fallback, type: 'DynamicsCompressorNode', fallbackError: 'AudioWorklet unavailable' };
    }

    function configureCompressorLimiter(limiter) {
      limiter.threshold.value = LIMITER_CEILING_DB;
      limiter.knee.value = 0;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.003;
      limiter.release.value = 0.16;
    }

    async function runOfflineGraphTest() {
      if (!window.WebVolumeBalancerCore || !window.LoudEaseProgrammePolicy) {
        throw new Error('shared DSP modules did not load');
      }
      if (!window.OfflineAudioContext) {
        throw new Error('OfflineAudioContext is not available');
      }
      const {
        dbToLinear
      } = window.WebVolumeBalancerCore;
      const fixture = buildFixture();
      const context = new OfflineAudioContext(1, fixture.samples.length, SAMPLE_RATE);
      const inputBuffer = context.createBuffer(1, fixture.samples.length, SAMPLE_RATE);
      inputBuffer.copyToChannel(fixture.samples, 0);
      const source = context.createBufferSource();
      const levelGain = context.createGain();
      const { limiter, type: limiterType, fallbackError } = await createLimiter(context);
      const schedule = gainSchedule(fixture.samples, fixture.segments);

      source.buffer = inputBuffer;
      source.connect(levelGain);
      levelGain.connect(limiter);
      limiter.connect(context.destination);

      for (const item of schedule) {
        levelGain.gain.setValueAtTime(dbToLinear(item.gainDb), item.time);
      }

      source.start(0);
      const rendered = await context.startRendering();
      const output = rendered.getChannelData(0);
      const metrics = Object.fromEntries(
        Object.entries(fixture.segments).map(([name, segment]) => [
          name,
          segmentMetrics(fixture.samples, output, segment)
        ])
      );
      const settledMetrics = Object.fromEntries(
        Object.entries(fixture.segments).map(([name, segment]) => [
          name,
          segmentMetrics(fixture.samples, output, {
            start: Math.max(segment.start, segment.end - Math.round(1.0 * SAMPLE_RATE)),
            end: segment.end
          })
        ])
      );
      const outputPeak = maxAbs(output);
      const gainStep = gainStepSummary(schedule);
      const recoveryStart = segmentFrameSummary(schedule, fixture.segments.recovery, 2.0);
      const quietLoudGapDb = Math.abs(settledMetrics.quietVoice.outputDb - settledMetrics.loudTone.outputDb);
      const checks = {
        graphRendered: rendered.length === fixture.samples.length,
        silenceNotLifted: metrics.silence.outputDb < -80,
        quietVoiceLifted: metrics.quietVoice.deltaDb > 18 && metrics.quietVoice.deltaDb <= MAX_LIFT_DB + 2,
        loudToneReduced: Math.abs(settledMetrics.loudTone.deltaDb) < 2 && Math.abs(settledMetrics.loudTone.outputDb - TARGET_RMS_DB) < 3,
        programLevelsConverge: quietLoudGapDb <= 13,
        burstControlled: metrics.burst.outputPeakDb <= LIMITER_CEILING_DB + 1.5,
        outputNotClipped: outputPeak < 0.999,
        gainSmooth: gainStep.maxIncrease <= MAX_GAIN_INCREASE_STEP_DB + 0.1 && gainStep.maxDecrease < MAX_CUT_DB + 1,
        recoveryAudible: metrics.recovery.outputDb > -45,
        recoveryLiftBuildsFromEvidence: recoveryStart.maxGainDb > 0.5
          && recoveryStart.maxGainDb < 9
          && recoveryStart.firstPositiveAtMs >= 500
          && recoveryStart.firstPositiveAtMs <= 1500
      };
      const passed = Object.values(checks).every(Boolean);
      return {
        passed,
        checks,
        metrics,
        settledMetrics,
        quietLoudGapDb,
        recoveryStart,
        outputPeak,
        gainStep,
        graph: {
          context: 'OfflineAudioContext',
          source: 'AudioBufferSourceNode',
          gain: 'GainNode',
          limiter: limiterType,
          limiterFallbackError: fallbackError,
          destination: 'AudioDestinationNode',
          sampleRate: rendered.sampleRate,
          length: rendered.length
        }
      };
    }

    window.runOfflineGraphTest = runOfflineGraphTest;
    document.getElementById('run').addEventListener('click', async () => {
      try {
        const output = await runOfflineGraphTest();
        result.textContent = JSON.stringify(output, null, 2);
      } catch (error) {
        result.textContent = String(error && error.stack || error);
      }
    });
  </script>
</body>
</html>
