<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dynamic Video Replace Test</title>
</head>
<body>
  <h1>Dynamic Video Replace Test</h1>
  <div id="slot"></div>
  <button id="start">Start video</button>
  <button id="switch" disabled>Replace video</button>
  <pre id="state">idle</pre>
  <script>
    let count = 0;
    let current = null;

    function writeState(text, mode) {
      document.getElementById('state').textContent = text;
      window.__WVB_SWITCH_STATE__ = {
        text,
        mode,
        switchCount: Math.max(0, count - 1)
      };
    }

    function stopCurrent() {
      if (!current) {
        return;
      }
      for (const item of current.tracks) {
        try {
          item.stop();
        } catch (_) {}
      }
      try {
        current.context.close();
      } catch (_) {}
      current = null;
    }

    async function makeVideo(mode) {
      count += 1;
      const video = document.createElement('video');
      video.width = 480;
      video.height = 270;
      video.controls = true;
      video.autoplay = false;
      video.muted = false;
      video.volume = 1;
      video.playsInline = true;
      video.dataset.generation = String(count);
      const canvas = document.createElement('canvas');
      canvas.width = 480;
      canvas.height = 270;
      const ctx = canvas.getContext('2d');
      let frame = 0;
      function draw() {
        frame += 1;
        ctx.fillStyle = count % 2 ? '#0f172a' : '#3f1d1d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = '24px sans-serif';
        ctx.fillText('video generation ' + count, 24, 48);
        requestAnimationFrame(draw);
      }
      draw();
      const context = new AudioContext();
      await context.resume();
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      const destination = context.createMediaStreamDestination();
      oscillator.frequency.value = mode === 0 ? 220 : 440;
      gain.gain.value = mode === 0 ? 0.16 : 0.012;
      oscillator.connect(gain).connect(destination);
      oscillator.start();
      const stream = canvas.captureStream(30);
      for (const track of destination.stream.getAudioTracks()) {
        stream.addTrack(track);
      }
      video.srcObject = stream;
      current = {
        context,
        tracks: stream.getTracks()
      };
      return video;
    }

    async function replace(mode) {
      stopCurrent();
      const slot = document.getElementById('slot');
      slot.textContent = '';
      const video = await makeVideo(mode);
      slot.appendChild(video);
      await video.play();
      document.getElementById('switch').disabled = false;
      writeState(mode === 0 ? 'loud-video' : 'quiet-video', mode);
    }

    document.getElementById('start').addEventListener('click', () => {
      count = 0;
      replace(0);
    });
    document.getElementById('switch').addEventListener('click', () => {
      replace(count % 2);
    });
    writeState('idle', 0);
  </script>
</body>
</html>
