<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Multi Video Test</title>
</head>
<body>
  <h1>Multi Video Test</h1>
  <video width="240" height="135" muted autoplay controls></video>
  <video width="240" height="135" muted autoplay controls></video>
  <video width="240" height="135" muted autoplay controls></video>
  <button id="start">Start mixed tones</button>
  <script>
    document.querySelectorAll('video').forEach((video, index) => {
      const canvas = document.createElement('canvas');
      canvas.width = 240;
      canvas.height = 135;
      const ctx = canvas.getContext('2d');
      function draw() {
        ctx.fillStyle = ['#111827', '#1e293b', '#312e81'][index];
        ctx.fillRect(0, 0, 240, 135);
        ctx.fillStyle = '#fff';
        ctx.font = '18px sans-serif';
        ctx.fillText('video ' + (index + 1), 20, 40);
        requestAnimationFrame(draw);
      }
      draw();
      video.srcObject = canvas.captureStream(15);
    });
    document.getElementById('start').addEventListener('click', async () => {
      const context = new AudioContext();
      await context.resume();
      [220, 330, 440].forEach((freq, index) => {
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.frequency.value = freq;
        gain.gain.value = 0.03 + (index * 0.02);
        oscillator.connect(gain).connect(context.destination);
        oscillator.start();
      });
    }, { once: true });
  </script>
</body>
</html>
